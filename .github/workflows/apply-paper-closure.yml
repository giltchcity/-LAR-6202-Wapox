name: Apply paper closure patch

on:
  push:
    branches:
      - agent/close-symbols-and-support-domains

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/close-symbols-and-support-domains
          fetch-depth: 0

      - name: Apply reviewed LaTeX edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          method_path = Path("sections/method.tex")
          method = method_path.read_text(encoding="utf-8")

          method = replace_once(
              method,
              r"""distance $\tau$. Marching Cubes (MC)~\cite{10.1145/37402.37422} extracts the
source surface $\mathcal M^-=(V^-,F)$.
""",
              r"""distance $\tau$. Marching Cubes (MC)~\cite{10.1145/37402.37422} extracts the
source surface $\mathcal M^-=(V^-,F)$. Let $\mathcal A$ denote the active TSDF
cells that contribute triangles to $\mathcal M^-$.
""",
              "define A",
          )

          method = replace_once(
              method,
              r"""where $D_i$ is an RGB-D depth image or a spherical LiDAR range image. The cache
""",
              r"""where ${\rm KF}$ indexes the retained SLAM keyframes and $D_i$ is an RGB-D
depth image or a spherical LiDAR range image. The cache
""",
              "define KF",
          )

          method = replace_once(
              method,
              r"""agrees with the fitted motion. Components without accepted controls inherit
robust nearby motion through three spatially separated synthetic anchors. The
resulting accepted or synthesized targets are
$\{p_a^*:a\in\mathcal C_P\}$.
""",
              r"""agrees with the fitted motion. Components without accepted controls inherit
robust nearby motion through three spatially separated synthetic anchors. Let
$\mathcal C_P\subseteq\{1,\ldots,|P^-|\}$ index the proxy vertices with
accepted measured or synthesized targets $p_a^*$.
""",
              "define C_P",
          )

          method = replace_once(
              method,
              r"""This preserves tangential and normal offsets relative to the corresponding
triangles. With trilinear source samples $\widetilde\Phi^-$ and
$\widetilde w^-$, define
\begin{equation}
\begin{aligned}
d^+(x)&=\min\!\left(\tau,\|x-q^+\|\right),\\
\Omega_{\rm tr}&=
\left\{x\in\mathcal X^+:\widetilde w^-(\Psi_f(x))>0\right\}.
\end{aligned}
\label{eq:transferred_support}
\end{equation}

Let $\Omega_{\rm fb}$ contain voxel-connected components of
$\{x\notin\Omega_{\rm tr}:d^+(x)\le1.5s\}$ that touch transferred support but
whose closest feature is not a boundary edge of $\bar F$. Their finite fallback
weight is
\begin{equation}
w_{\rm fb}(x)=\operatorname{clamp}_{[0,1]}\!\left(
1.5-\frac{\|x-q^+\|}{s}\right).
\label{eq:fallback_weight}
\end{equation}
""",
              r"""This preserves tangential and normal offsets relative to the corresponding
triangles. With trilinear source samples $\widetilde\Phi^-$ and
$\widetilde w^-$, define
\begin{equation}
\begin{aligned}
d^+(x)&=\min\!\left(\tau,\|x-q^+\|\right),\\
\widehat{\Omega}_{\rm tr}&=
\left\{x\in\mathcal X^+:\widetilde w^-(\Psi_f(x))>0\right\}.
\end{aligned}
\label{eq:transferred_support}
\end{equation}
Let
\[
\Omega_{\rm nb}=
\left\{x\in\widehat{\Omega}_{\rm tr}:
\left|\widetilde\Phi^-(\Psi_f(x))\right|<\tau\right\}
\]
be the transferred source narrow band. Each 6-connected component of
$\widehat{\Omega}_{\rm tr}\setminus\Omega_{\rm nb}$ is retained only if it
touches $\Omega_{\rm nb}$; an extended voxel is rejected if its insertion
would create a sign change across an adjacent active-voxel pair. Let
$\Omega_{\rm tr}$ denote $\Omega_{\rm nb}$ together with the surviving
transferred extension.

Let $\partial_{\rm open}\mathcal M^+$ denote the union of open boundary edges
and their incident vertices. Fallback support is restricted to unsupported
voxels with strictly positive finite-band weight:
\begin{equation}
\Omega_{\rm fb}=
\left\{x\in\mathcal X^+\setminus\Omega_{\rm tr}:
\|x-q^+\|<1.5s,\ q^+\notin\partial_{\rm open}\mathcal M^+\right\}.
\label{eq:fallback_support}
\end{equation}
Its weight is
\begin{equation}
w_{\rm fb}(x)=\operatorname{clamp}_{[0,1]}\!\left(
1.5-\frac{\|x-q^+\|}{s}\right).
\label{eq:fallback_weight}
\end{equation}
""",
              "split transferred and fallback support",
          )

          method = replace_once(
              method,
              r"""\end{equation}
A fallback voxel is rejected if its insertion would create a sign change across
an adjacent active-voxel pair. Outside $\Omega^+$ the zero weight makes the
stored distance immaterial. The resulting
""",
              r"""\end{equation}
Because transferred weights are positive on $\Omega_{\rm tr}$ and the fallback
band is strict, by construction
$\Omega^+=\{x\in\mathcal X^+:w^+(x)>0\}$. Outside $\Omega^+$ the zero weight
makes the stored distance immaterial. The resulting
""",
              "define positive-weight output domain",
          )

          method = replace_once(
              method,
              r"""The cache and resolved correction state require
$O(\sum_{i\in{\rm KF}}|D_i|)$ and $O(n_vA)$ storage, respectively. If each
source vertex is tested against at most $\kappa$ cached keyframes whose valid
views cover it, the complete correction cost is
""",
              r"""The cache and resolved correction state require
$O(\sum_{i\in{\rm KF}}|D_i|)$ and $O(n_vA)$ storage, respectively. Let
$\kappa\le K_{\rm KF}$ be the maximum number of eligible cached keyframes
tested for any source vertex. The block-local allocation in
\eqref{eq:allocation} makes $X^+$ follow the warped-surface footprint rather
than scene extent. The complete correction cost is
""",
              "define kappa and cite allocation",
          )

          method = replace_once(
              method,
              r"""The reported implementation uses $n_v=15$ and a 60K-vertex proxy cap; all
remaining thresholds and discrete predicates are fixed within each sensor
modality and are not tuned per case. The dense-frame reintegration term
""",
              r"""The reported implementation uses $n_v=15$ and a 60K-vertex proxy cap; all
remaining thresholds and discrete predicates are fixed within each sensor
modality, are not tuned per case, and are listed in the supplementary YAML
configurations. The dense-frame reintegration term
""",
              "supplementary YAML statement",
          )

          method_path.write_text(method, encoding="utf-8")

          experiments_path = Path("sections/experiments.tex")
          experiments = experiments_path.read_text(encoding="utf-8")

          experiments = replace_once(
              experiments,
              r"""We evaluate 39 RGB-D loop-closure cases from 18 Kimera-Multi
sequences~\cite{tian23arxiv_kimeramultiexperiments} and 12 LiDAR cases from
six KITTI sequences~\cite{Geiger2013IJRR}. Every method reconstructs the same
temporal interval and uses the same GT: a 5 m tube around the official
Kimera-Multi trajectory or GT-registered KITTI points within the mapper's 25 m
ray range. Predictions outside the GT frame are aligned by a RANSAC--Umeyama
$\mathrm{Sim}(3)$ fitted only to timestamp-matched trajectory positions; no
mesh-to-GT registration is used.
""",
              r"""We evaluate 39 RGB-D loop-closure cases from 18 Kimera-Multi
sequences~\cite{tian23arxiv_kimeramultiexperiments} and 12 LiDAR cases from
six KITTI sequences~\cite{Geiger2013IJRR}. Every method reconstructs the same
temporal interval. For Kimera-Multi, the reference geometry is the official
registered ground-truth point cloud, cropped to a 5 m tube around the
corresponding official trajectory to match Voxblox's maximum integration
range. For KITTI, the reference is the GT-registered point cloud within the
mapper's 25 m ray range. Predictions expressed outside the GT frame are aligned
by a RANSAC--Umeyama $\mathrm{Sim}(3)$ fitted only to timestamp-matched
trajectory positions; no mesh-to-GT registration is used. Reconstructions
built from the same corrected trajectory share one transform per case.
Voxgraph is aligned from its own reported trajectory because it maintains an
independently optimized submap frame; this baseline-specific trajectory fit
cannot improve WarpVox relative to Voxgraph.
""",
              "GT and alignment protocol",
          )

          experiments = replace_once(
              experiments,
              r"""\noindent\textbf{Baselines.}
Uncorrected TSDF uses the pre-correction trajectory. Open3D~\cite{zhou2018open3dmodernlibrary3d}
and Wavemap~\cite{reijgwart2023wavemap} replay corrected poses into an
independent TSDF and a wavelet occupancy map, respectively; Voxgraph
~\cite{reijgwart2020voxgraph} optimizes rigid TSDF submaps. Voxblox
reintegration~\cite{Oleynikova_2017} is the representation-matched reference.
WarpVox instead uses the active uncorrected TSDF, cached keyframe range images,
and the pre/post-correction trajectories.
""",
              r"""\noindent\textbf{Baselines.}
Uncorrected TSDF uses the pre-correction trajectory.
Open3D~\cite{zhou2018open3dmodernlibrary3d} is an independent corrected-pose
TSDF rebuild whose fusion and meshing conventions differ from Voxblox;
Wavemap~\cite{reijgwart2023wavemap} rebuilds a wavelet occupancy map, and
Voxgraph~\cite{reijgwart2020voxgraph} optimizes rigid TSDF submaps. Voxblox
reintegration~\cite{Oleynikova_2017} is therefore the representation-matched
reference. WarpVox instead uses the active uncorrected TSDF, cached keyframe
range images, and the pre/post-correction trajectories.
""",
              "baseline positioning",
          )

          experiments = replace_once(
              experiments,
              r"""reported timer was collected in the evaluation run that produced its output.
""",
              r"""reported timer was collected in the evaluation run that produced its output.
The anonymized supplementary code archive contains the WarpVox implementation,
evaluation scripts, and YAML configurations used for all reported WarpVox
results.
""",
              "code release statement",
          )

          for old, new, label in [
              (r" & Voxblox reint. & 10.93 & 28.71 & \textbf{48.67} & 109.25 \\",
               r" & Voxblox reint. & 10.93 & 28.71 & 48.67 & 109.25 \\",
               "Kimera reintegration bold"),
              (r" & \textbf{WarpVox} & \textbf{11.13} & \textbf{28.76} & 48.39 & 2.51 \\",
               r" & \textbf{WarpVox} & 11.13 & 28.76 & 48.39 & 2.51 \\",
               "Kimera WarpVox bold"),
              (r" & Open3D & \textbf{13.50} & 38.58 & 61.02 & -- \\",
               r" & Open3D & 13.50 & 38.58 & 61.02 & -- \\",
               "KITTI Open3D bold"),
              (r" & Voxblox reint. & 13.21 & \textbf{44.29} & \textbf{67.45} & 15.73 \\",
               r" & Voxblox reint. & 13.21 & 44.29 & 67.45 & 15.73 \\",
               "KITTI reintegration bold"),
          ]:
              experiments = replace_once(experiments, old, new, label)

          experiments = replace_once(
              experiments,
              r"""\end{table}

WarpVox is $43.46\times$ faster than reintegration on Kimera-Multi and
""",
              r"""\end{table}

On Kimera-Multi, WarpVox differs from reintegration by
$+0.20/+0.05/-0.28$ pp at F@10/F@25/F@50. We treat these sub-percentage-point
mean differences as parity and do not claim superiority over reintegration.
WarpVox is $43.46\times$ faster than reintegration on Kimera-Multi and
""",
              "parity statement",
          )

          experiments = replace_once(
              experiments,
              r"""\noindent\textbf{Source-volume semantics.}
We additionally compare the reconstructed TSDF with corrected-pose Voxblox
reintegration on ten 0.25 m checkpoints. Over jointly supported voxels within
the reference truncation band, WarpVox obtains a normalized TSDF MAE of 0.384
and $95.17\%$ sign agreement. Its observed-support precision, recall, and IoU
are $95.53\%$, $68.38\%$, and $66.33\%$, respectively. Thus, WarpVox
conservatively preserves observed-space semantics, introducing little
unsupported space but retaining less support than full reintegration.
""",
              r"""\noindent\textbf{Source-volume semantics.}
For the fields defined in
\eqref{eq:hybrid_tsdf}--\eqref{eq:hybrid_weight}, we compare WarpVox with
corrected-pose Voxblox reintegration on ten 0.25 m checkpoints. Over voxels
with positive weight in both maps and within the reference truncation band,
the truncation-normalized TSDF MAE
$\mathbb E[|\Phi^+-\Phi_{\rm reint}|]/\tau$ is 0.384, where
$\Phi_{\rm reint}$ denotes the reintegrated reference field; sign agreement is
$95.17\%$. Treating $w>0$ as observed, support precision, recall, and IoU are
$95.53\%$, $68.38\%$, and $66.33\%$, respectively. Thus, WarpVox
conservatively preserves observed-space semantics, introducing little
unsupported space but retaining less support than full reintegration.
""",
              "define volumetric metrics",
          )

          experiments = replace_once(
              experiments,
              r"""Table~\ref{tab:ablation} evaluates every variant on the same ten 0.25 m
Kimera-Multi checkpoints and separates deformation scale from the Stage~3 and
Stage~4 design choices.
""",
              r"""Table~\ref{tab:ablation} evaluates every variant on the same ten 0.25 m
Kimera-Multi checkpoints. The Stage~3 rows alter the proxy and control
construction used by the constrained ARAP solve in \eqref{eq:arap}; the
Stage~4 rows compare mesh-only conversion with the source-supported fields in
\eqref{eq:hybrid_tsdf}--\eqref{eq:hybrid_weight}.
""",
              "connect ablation to equations",
          )

          experiments_path.write_text(experiments, encoding="utf-8")
          PY

          rm .github/workflows/apply-paper-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sections/method.tex sections/experiments.tex .github/workflows/apply-paper-closure.yml
          git commit -m "Close symbols and support-domain definitions"
          git push origin HEAD:agent/close-symbols-and-support-domains
