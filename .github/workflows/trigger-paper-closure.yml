name: Trigger paper closure patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply reviewed LaTeX edits
        shell: bash
        run: |
          awk '
            /python3 - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-paper-closure.yml > /tmp/apply-paper-closure.py
          python3 /tmp/apply-paper-closure.py

          rm .github/workflows/apply-paper-closure.yml
          rm .github/workflows/trigger-paper-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sections/method.tex sections/experiments.tex .github/workflows
          git commit -m "Close symbols and support-domain definitions"
          git push origin HEAD:${{ github.head_ref }}
